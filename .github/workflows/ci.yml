# Contrôles du code et des fiches à chaque push sur main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances (pyproject.toml, extra dev)
        run: uv pip install --system -r pyproject.toml --extra dev
      - name: Ruff
        run: ruff check scripts tests && ruff format --check scripts tests
      - name: Mypy
        run: python -m mypy
      - name: Tests (toutes les fiches, messages d'erreur, README)
        run: python -m pytest
