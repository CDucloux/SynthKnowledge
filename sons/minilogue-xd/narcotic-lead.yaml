synthe: minilogue-xd
titre: Narcotic Lead
categorie: lead
tags: [rock, "90s", riff, digital]
confiance: 2
reference:
  artiste: Liquido
  morceau: Narcotic
  annee: 1998
  passage: riff de clavier de l'intro, repris sur tout le morceau
  synthe_origine: "Roland D-70 modifié, sons créés par son ancien propriétaire"
resume: >-
  Le riff de clavier qui ouvre le morceau : un son numérique années 90, brillant
  et un peu métallique à l'attaque, avec un corps qui tient, élargi par un chorus.
  Les sons d'origine étaient uniques : la fiche reconstruit le caractère.

params:
  voice: {mode: poly}
  vco1: {wave: saw, octave: 8}
  vco2: {wave: sqr, octave: 8, pitch: 7, shape: 200}
  multi: {engine: vpm, type: Decay2, shape: 350}
  mixer: {vco1: 850, vco2: 550, multi: 450}
  filter: {cutoff: 640, resonance: 120, keytrack: 50}
  amp_eg: {a: 0, d: 680, s: 620, r: 320}
  eg: {a: 0, d: 380, int: 35, target: cutoff}
  mod_fx: {on: true, type: Chorus, subtype: Stereo, time: 450, depth: 45}
  reverb: {on: true, type: Room, time: 400, depth: 22}

settings:
  - {nom: "Amp Velocity (bouton 8)", valeur: "≈ 60 : le riff garde du relief"}

etapes:
  - "Programme init (201 à 500), *VOICE MODE* POLY."
  - "*VCO 1* : SAW 8'. *VCO 2* : SQR 8', *PITCH* +7 cents, *SHAPE* 200."
  - "*MULTI ENGINE* : VPM, *TYPE* Decay2, *SHAPE* 350 : le « tic » numérique de l'attaque."
  - "*MIXER* : *VCO 1* 850, *VCO 2* 550, *MULTI* 450."
  - "*FILTER* : *CUTOFF* 640, *RESONANCE* 120, *KEYTRACK* 50 %. *EG* sur CUTOFF : *DECAY* 380, *EG INT* +35 %."
  - "*AMP EG* : *ATTACK* 0, *DECAY* 680, *SUSTAIN* 620, *RELEASE* 320."
  - "*EFFECTS* : MOD sur CHORUS Stereo (*DEPTH* 45 %), REVERB Room discrète (22 %)."
oreille:
  - "Trop « synthé analogique », pas assez numérique : *MULTI* vers 600 ou *SHAPE* du MULTI vers 500."
  - "Trop sec, pas assez large : *DEPTH* du chorus vers 60 %."
  - "Attaque trop douce : *EG INT* vers +50 % ; trop agressive : *CUTOFF* vers 550."
  - "Notes qui se mélangent : *RELEASE* vers 200."
jeu:
  - "Riff à une note à la fois, main droite, médium-aigu, joué régulier et un peu détaché."
  - "Le *RELEASE* laisse chaque note déborder légèrement sur la suivante, comme au disque."

analyse:
  - titre: "Les oscillateurs : une attaque numérique sur un corps analogique"
    texte: >-
      Le D-70 fait de la synthèse « LA »^[Linear Arithmetic : la méthode Roland de la
      famille D-50, qui assemble des échantillons PCM et des formes d'onde de synthèse
      dans un même son.] [2]. On imite cette idée par superposition : *scie* et *carré*
      analogiques pour le corps, et le moteur *VPM* en Decay2 pour un éclat métallique
      qui ne dure que l'attaque, comme un transitoire échantillonné.
  - titre: "Le filtre : brillant mais tenu"
    texte: >-
      *CUTOFF* au milieu avec un coup d'*EG* (+35 %) : chaque note commence brillante
      puis se pose. *KEYTRACK* à 50 % garde le riff homogène quand il monte. Peu de
      résonance : le son reste « produit », sans le « wah » des synthés analogiques.
  - titre: "Les enveloppes : un clavier qui chante"
    texte: >-
      Pas d'attaque, un *DECAY* moyen et un *SUSTAIN* assez haut : un son entre le
      pincé et le tenu, typique des presets numériques du début des années 90. Le
      *RELEASE* (320) fait déborder un peu chaque note sur la suivante et lie le riff.
  - titre: "L'espace : le chorus qui fait les 90s"
    texte: >-
      Le *CHORUS* stéréo double le son avec un léger décalage de hauteur et l'élargit :
      un réflexe de l'époque, les effets intégrés du D-70 étant réputés de grande
      qualité [2]. Une petite reverb Room le place dans le mix rock sans le noyer.
      En POLY, les fins de notes peuvent se chevaucher.

tracabilite:
  - "Documenté [1] : le riff vient d'un Roland D-70 modifié acheté d'occasion ; selon Wolfgang Schrödl, ses sons, créés par l'ancien propriétaire, étaient uniques."
  - "Documenté [2] : le D-70 est un synthé « Super LA » (synthèse LA / PCM), avec filtres et effets intégrés."
  - "Reconstitué : tout le patch (aucun réglage d'origine connu, les sons étaient personnels) ; traduction LA → VCO + VPM du XD."

sources:
  - titre: "Narcotic (Liquido song)"
    site: Wikipédia (en)
    url: https://en.wikipedia.org/wiki/Narcotic_(Liquido_song)
    note: D-70 modifié, d'après Hit100 (2023) et NPO Radio 2
  - titre: "Roland D-70, Super LA Synthesizer"
    site: Synthmania
    url: https://www.synthmania.com/d-70.htm
    note: architecture LA / PCM, filtres et effets
