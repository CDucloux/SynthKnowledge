synthe: minilogue-xd
titre: Jump Brass
categorie: cuivre
tags: [poly, "80s", stab]
confiance: 2
reference:
  artiste: Van Halen
  morceau: Jump
  annee: 1984
  passage: riff d'accords de l'intro, dès 0:00
  synthe_origine: Oberheim OB-Xa (preset A1), chorus et delay
resume: >-
  Le stab de cuivres synthétiques le plus célèbre des années 80 : deux scies
  légèrement désaccordées par voix, filtre assez ouvert avec un petit coup
  d'enveloppe, sustain haut, puis chorus et un soupçon de delay pour l'épaisseur.

params:
  vco1: {wave: saw, octave: 8, pitch: 0}
  vco2: {wave: saw, octave: 8, pitch: 8}
  mixer: {vco1: 900, vco2: 900}
  filter: {cutoff: 620, resonance: 300, drive: 50, keytrack: 50}
  amp_eg: {a: 20, d: 500, s: 900, r: 300}
  eg: {a: 30, d: 450, int: 40, target: cutoff}
  mod_fx: {on: true, type: Chorus, subtype: Stereo, time: 400, depth: 40}
  delay: {on: true, type: Stereo, time: 300, depth: 20}

settings:
  - nom: "Amp Velocity (bouton 8)"
    valeur: "0 : stabs réguliers quelle que soit la frappe"
  - nom: "Initialize (bouton 13)"
    valeur: "partir d'un programme init (201 à 500)"

etapes:
  - "Charger un programme init (201 à 500), *VOICE MODE* sur POLY."
  - "*VCO 1* et *VCO 2* : *WAVE* SAW, *OCTAVE* 8'. *PITCH* du *VCO 2* à +8 cents."
  - "*MIXER* : *VCO 1* et *VCO 2* à 900, *MULTI* à 0."
  - "*FILTER* : *CUTOFF* 620, *RESONANCE* 300, *DRIVE* et *KEYTRACK* au milieu (50 %)."
  - "*EG* sur CUTOFF : *ATTACK* 30, *DECAY* 450, *EG INT* +40 %."
  - "*AMP EG* : attaque courte (20), *SUSTAIN* haut (900), *RELEASE* 300."
  - "*EFFECTS* : MOD sur CHORUS Stereo (ON), DEL sur Stereo (ON, *DEPTH* 20 %)."
oreille:
  - "Pas assez cuivré : *EG INT* vers +55 %, ou *ATTACK* de l'EG vers 60."
  - "Trop brillant ou criard : *CUTOFF* vers 520, *RESONANCE* vers 200."
  - "Plus large : *DEPTH* du chorus vers 60 %, ou *PITCH* du *VCO 2* à +12 C."
jeu:
  - "Accords à trois sons en position serrée, main droite, registre médium."
  - "Stabs détachés et rythmés : relâcher franchement entre les accords."
analyse:
  - titre: "Les oscillateurs : deux scies désaccordées"
    texte: >-
      Deux *scies* en 8', le *VCO 2* à +8 cents : chaque voix bat légèrement et sonne
      large. La scie contient toutes les harmoniques, comme un cuivre réel : c'est la
      base de tous les « brass » synthétiques.
  - titre: "Le filtre : ouvert à moitié, avec un coup"
    texte: >-
      *CUTOFF* au milieu (620) avec un peu de *RESONANCE* : brillant sans être criard.
      *DRIVE* à 50 % ajoute du mordant. *KEYTRACK* à 50 % garde l'équilibre entre les
      accords graves et aigus.
  - titre: "Les enveloppes : l'attaque cuivrée"
    texte: >-
      L'*EG* sur CUTOFF, avec une petite attaque (30), ouvre le filtre juste après le
      début de la note : c'est le « blat » qui fait cuivre. L'ampli a un sustain haut
      (stabs pleins) et un *RELEASE* moyen pour que les accords ne se coupent pas net.
  - titre: "L'espace : chorus et delay"
    texte: >-
      Le *CHORUS* stéréo double chaque voix avec un léger décalage de hauteur : le son
      s'élargit, comme l'OB-Xa passé dans ses effets. Un soupçon de *DELAY* prolonge
      les stabs sans écho audible. En POLY, quatre voix suffisent pour les accords à
      trois sons.
tracabilite:
  - "Documenté [1] : Oberheim OB-Xa, preset A1, passé dans un chorus et un delay."
  - "Repères d'émulation [2] : scies désaccordées, cutoff ≈ 50 %, résonance ≈ 42 %, mesurés sur un autre synthé."
  - "Reconstitué : toutes les valeurs du minilogue XD, enveloppes et profondeurs d'effets."
sources:
  - "Reverb News, « The Synth Sounds of Van Halen's Jump » (OB-Xa, patch A1, chorus et delay) : reverb.com/news/the-synth-sounds-of-van-halens-jump"
  - "MusicRadar, « The 40 greatest synth sounds of all time, No 4 » (scies désaccordées, cutoff 50 %, résonance 42 %) : musicradar.com/news/van-halen-jump-best-synth-sound"
  - "MusicTech, « Weekend Workshop : Prince and Van Halen synth sounds with OB-Xd »"
