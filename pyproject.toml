[project]
name = "synther"
version = "0.1.0"
description = "Fiches son pour Moog Messenger et Korg minilogue XD (YAML → PDF Typst)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Compilation sans la CLI typst.
typst = ["typst>=0.13"]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.5", "types-PyYAML"]

[tool.ruff]
line-length = 79
src = ["scripts", "tests"]

[tool.ruff.lint]
# pycodestyle (PEP 8), pyflakes, imports, nommage PEP 8, annotations.
select = ["E", "W", "F", "I", "N", "UP", "ANN", "B"]
# Any : les données YAML brutes ne sont pas typées avant validation.
ignore = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "."]

[tool.mypy]
files = ["scripts", "tests"]
mypy_path = "scripts"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["typst"]
ignore_missing_imports = true
