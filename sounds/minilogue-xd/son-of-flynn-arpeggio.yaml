synth: minilogue-xd
title: The Son of Flynn Arpeggio
category: arp
tags: [soundtrack, "2010s", sequence, arpeggio]
confidence: 1
reference:
  artist: Daft Punk
  song: The Son of Flynn
  year: 2010
  part: arpège en doubles croches qui ouvre le morceau (TRON Legacy, piste 3)
  original_synth: "non documenté (score électronique et orchestre de 85 musiciens)"
  original_synth_short: non documenté
summary: >-
  Le moteur du morceau : un accord de Sol dièse mineur égrené en doubles croches sur deux
  octaves, son pincé et brillant, qui pose la tension avant l'entrée des cordes.
  Notes d'après une transcription ; le synthé d'origine n'est pas documenté, le son
  est reconstitué à l'oreille.

params:
  voice: {mode: poly, tempo: 106.7}
  vco1: {wave: saw, octave: 8}
  vco2: {wave: saw, octave: 4, pitch: 6}
  mixer: {vco1: 1023, vco2: 650}
  filter: {cutoff: 430, resonance: 220, keytrack: 50}
  amp_eg: {a: 0, d: 430, s: 0, r: 320}
  eg: {a: 0, d: 330, int: 45, target: cutoff}
  mod_fx: {on: true, type: Chorus, subtype: Stereo, time: 300, depth: 30}
  delay: {on: true, type: Tape BPM, time: 640, depth: 18}
  reverb: {on: true, type: Hall, time: 620, depth: 30}

sequence:
  tempo: 106.7
  resolution: 1/16
  gate: 50
  steps: >-
    G#3 B3 D#4 G#4 B4 D#5 G#3 B3 D#4 G#4 B4 D#5 G#3 B3 D#4 D#4

settings:
  - {name: "EG Velocity (bouton 8)", value: "0 : toutes les notes du séquenceur s'ouvrent pareil"}

steps:
  - "Programme init (201 à 500), *VOICE MODE* POLY, *TEMPO* 106.7."
  - "*VCO 1* : SAW 8'. *VCO 2* : SAW 4', *PITCH* +6 cents. *MIXER* : 1023 et 650."
  - "*FILTER* : *CUTOFF* 430, *RESONANCE* 220, *KEYTRACK* 50 %."
  - "*EG* sur CUTOFF : *ATTACK* 0, *DECAY* 330, *EG INT* +45 %."
  - "*AMP EG* : *ATTACK* 0, *DECAY* 430, *SUSTAIN* 0, *RELEASE* 320."
  - "*MOD FX* Chorus Stereo (30 %), *DELAY* Tape BPM (18 %), *REVERB* Hall (30 %)."
tweaks:
  - "Trop mou : *DECAY* de l'*EG* vers 250 et *EG INT* vers +55 %."
  - "Trop agressif : *CUTOFF* vers 350, *VCO 2* vers 450."
  - "Trop sec face aux cordes : *REVERB* *DEPTH* vers 40 %."
playing:
  - "Saisie : *REC* à l'arrêt, une note par pas, *PLAY*. Grille = mesure 1. Un demi-ton trop haut : Transpose -1 (PROGRAM EDIT, bouton 6)."
  - "Accords suivants : mode ARP/LATCH, tenir l'accord ; motif à vérifier à l'oreille."

analysis:
  - title: "Les oscillateurs : deux scies à l'octave"
    text: >-
      La *scie* contient toutes les harmoniques : chaque note est riche avant même
      le filtre. Doubler par une seconde scie une octave plus haut, à peine
      désaccordée, ajoute de l'éclat et un léger mouvement, sans épaissir le grave
      que les cordes et la basse occupent déjà.
  - title: "Le filtre : un pincement à chaque pas"
    text: >-
      *CUTOFF* assez bas, *EG INT* positif : le filtre s'ouvre à l'attaque puis se
      referme en quelques dixièmes de seconde. C'est ce « pinc » qui détache les
      doubles croches. Le *KEYTRACK* à 50 % garde les notes aiguës de l'arpège
      (jusqu'au Ré dièse 5) aussi brillantes que les graves.
  - title: "Les enveloppes : rien ne tient"
    text: >-
      Pas de sustain : chaque note s'éteint d'elle-même, le séquenceur en relance
      une toutes les doubles croches. Le *RELEASE* court laisse les notes se
      chevaucher un peu (4 voix), ce qui lie l'arpège comme une seule ligne.
  - title: "L'espace et le jeu : une machine qui tourne"
    text: >-
      Deux relevés [2][3] donnent le même motif de six notes (l'accord sur deux
      octaves) qui boucle sur 16 pas et change d'accord toutes les deux mesures.
      Imaginando passe le synthé dans un effet de modulation stéréo et un écho à
      bande calé sur le tempo [3] : d'où le chorus et le *Tape BPM*. Avec la reverb, le
      synthé partage l'espace de l'orchestre, arpèges et cordes « imbriqués » [1].

traceability:
  - "Documenté [1] : score de Daft Punk mêlant électronique et orchestre de 85 musiciens (AIR Lyndhurst), arrangé par Joseph Trapanese ; aucun synthé précis cité pour ce morceau."
  - "Transcrit [3] : projet Ableton d'Imaginando, arpège en Sol dièse mineur à 106,7 BPM, effets DLYM (modulation stéréo) et K7D (écho à bande synchronisé, ping-pong) ; c'est la version de la grille."
  - "Transcrit [2] : même motif, piste « Synth » (distincte des cordes et de la basse), mais un demi-ton plus bas (Sol mineur) et à 105 BPM. Tonalité à trancher à l'oreille."
  - "Hypothèse [4] : sur un forum, son proche d'un Oberheim SEM ou de deux scies désaccordées filtrées ; avis non vérifiés."
  - "Reconstitué : formes d'onde, filtre, enveloppes, effets et toutes les valeurs XD, à l'oreille."

