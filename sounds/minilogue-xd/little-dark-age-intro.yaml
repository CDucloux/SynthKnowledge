synth: minilogue-xd
title: Little Dark Age Intro
category: lead
tags: [synthpop, "2010s", accords, sequence, vibrato]
confidence: 2
reference:
  artist: MGMT
  song: Little Dark Age
  year: 2017
  part: suite d'accords inquiétante de l'intro, filtre qui pulse en séquence
  original_synth: "non documenté ; son très traité par les effets selon Reverb Machine"
summary: >-
  Les accords sombres qui ouvrent le morceau : des scies légèrement désaccordées,
  un vibrato rapide qui fait « tanguer » la note, et un filtre résonant qui s'ouvre
  et se ferme en rythme comme une séquence. Delay en doubles croches et reverb.

params:
  voice: {mode: poly}
  vco1: {wave: saw, octave: 8}
  vco2: {wave: saw, octave: 8, pitch: 8}
  mixer: {vco1: 900, vco2: 800}
  filter: {cutoff: 470, resonance: 330, keytrack: 50}
  amp_eg: {a: 15, d: 512, s: 1023, r: 320}
  lfo: {wave: sqr, mode: bpm, rate: 600, rate_label: "1/8", int: 220, target: cutoff}
  mod_fx: {on: true, type: Chorus, subtype: Vibrato, time: 720, depth: 35}
  delay: {on: true, type: Stereo BPM, time: 300, depth: 25}
  reverb: {on: true, type: Hall, time: 600, depth: 30}

settings:
  - {name: "LFO (bouton 7)", value: "Key Sync On : la séquence repart à chaque accord"}
  - {name: "Tempo", value: "*TEMPO* calé sur le morceau : le LFO et le delay s'y synchronisent"}

steps:
  - "Programme init (201 à 500), *VOICE MODE* POLY ; régler *TEMPO* sur le morceau."
  - "*VCO 1* et *VCO 2* : SAW 8'. *PITCH* du *VCO 2* à +8 cents. *MIXER* : 900 et 800."
  - "*FILTER* : *CUTOFF* 470, *RESONANCE* 330, *KEYTRACK* 50 %."
  - "*LFO* : SQR, mode BPM, *RATE* sur 1/8 (écran), *INT* 220, *TARGET* CUTOFF : le filtre pulse en doubles croches."
  - "*AMP EG* : attaque douce (15), *SUSTAIN* à fond, *RELEASE* 320."
  - "*MOD FX* : CHORUS, sous-type Vibrato (SHIFT + SELECT), *TIME* 720, *DEPTH* 35 %."
  - "*DELAY* Stereo BPM sur la double croche (25 %), *REVERB* Hall 30 %."
tweaks:
  - "La séquence ne s'entend pas assez : *INT* du LFO vers 320, *RESONANCE* vers 420."
  - "Trop sombre (l'original garde des aigus non filtrés) : *CUTOFF* vers 560."
  - "Vibrato trop lent ou trop doux : *TIME* (vitesse) et *DEPTH* du vibrato, à l'oreille vers ≈ 6-7 Hz."
  - "Les échos brouillent les accords : *DEPTH* du delay vers 15 %."
playing:
  - "Accords tenus, main droite, une harmonie par mesure : la séquence fait le rythme."
  - "Le Key Sync relance la séquence à chaque accord : attaquer les accords pile sur le temps."

analysis:
  - title: "Les oscillateurs : des scies qui tanguent"
    text: >-
      La recréation de [1] part d'une seule *scie* avec un peu d'unisson désaccordé :
      on la reproduit par deux scies à +8 cents. Le vibrato rapide (6,7 Hz dans [1])
      fait osciller la hauteur : avec les accords mineurs, cela donne ce côté
      instable et inquiétant. Ici, il vient du *CHORUS* en mode Vibrato, ce qui
      laisse le *LFO* libre pour le filtre.
  - title: "Le filtre : la séquence résonante"
    text: >-
      Dans [1], le filtre (passe-bas 12 dB, résonance 32 %) est piloté par une
      séquence de pas dessinée^[Un LFO dont on dessine la forme pas par pas : le
      filtre saute d'une valeur à l'autre au lieu de glisser.] . Le *LFO* du XD en
      carré synchronisé au tempo fait une version à deux pas : ouvert, fermé, en
      doubles croches. La *RESONANCE* fait « parler » chaque ouverture.
  - title: "Les enveloppes : des accords tenus"
    text: >-
      L'ampli est presque un orgue : attaque très légèrement adoucie, *SUSTAIN* à
      fond, *RELEASE* moyen pour que les accords se fondent. Tout le mouvement vient
      du *LFO* sur le filtre : l'enveloppe ne fait que tenir la note.
  - title: "L'espace : le traitement fait le son"
    text: >-
      Selon [1], le son d'origine est « fortement traité » : phaser, delay à la double
      croche, reverb, filtrage des extrêmes. Le XD n'a qu'un MOD FX : on garde le
      vibrato plutôt que le phaser. Le *DELAY* BPM en doubles croches renforce la
      pulsation de la séquence, la reverb donne la profondeur sombre.

traceability:
  - "Recette d'écoute [1] : scie avec léger unisson, vibrato LFO 6,7 Hz, passe-bas 12 dB modulé par une séquence de pas dessinée, résonance 32 %, mix de filtre 82 %, phaser 40 %, delay 1/16, reverb, son « fortement traité »."
  - "Non documenté : synthé d'origine de cette partie (aucune source)."
  - "Reconstitué : traduction XD (2 VCO désaccordés, LFO carré BPM à la place de la séquence dessinée, vibrato par le MOD FX, phaser abandonné)."

sources:
  - title: "MGMT's Little Dark Age Synth Sounds"
    site: Reverb Machine
    date: mai 2021
    url: https://reverbmachine.com/blog/mgmt-little-dark-age-synth-sounds
    note: recréation dans Serum, patch par patch
