synthe: messenger
titre: Lucky Man Lead
categorie: lead
tags: [prog, 70s, glide]
confiance: 2
reference:
  artiste: Emerson, Lake & Palmer
  morceau: Lucky Man
  annee: 1970
  passage: solo de Moog improvisé de la fin (≈ 3:50 → fin)
  synthe_origine: Moog modulaire de Keith Emerson
resume: >-
  Lead chantant de deux carrés légèrement désaccordés, filtre à demi ouvert et
  *GLIDE* très présent, avec un vibrato ajouté à la molette. Le Messenger étant
  monophonique et de même lignée, la traduction est directe.

params:
  osc:
    oct1: 8
    oct2: 8
    wave1: 13.25
    wave2: 13.25
    osc2_freq: 12.17
  mixer:
    osc1: 15
    osc2: 15
  filter:
    mode: lp4
    cutoff: 12.5
    eg_amount: 13
    resonance: 9
    kb_tracking: true
  fenv: {a: 7, d: 13, s: 14, r: 10}
  aenv: {a: 7.5, d: 12, s: 17, r: 10.5}
  perf:
    glide: 13
    lfo2_rate: 13
    lfo2_dest: [pitch]
    mod_wheel: 20

settings:
  - nom: Glide Config (CONFIG 1.3)
    valeur: "PGM 14 *Exponential*, Legato Glide et Gated Glide éteints"

etapes:
  - Maintenir *PANEL* 1 s (init).
  - "*WAVESHAPE 1* et *WAVESHAPE 2* sur le carré (≈ 1:15), les deux *OCTAVE* sur 8'."
  - "*OSC 2 FREQ* à peine à droite de midi : chercher un battement lent (≈ 1 à 2 par seconde)."
  - "*MIXER* : *OSC 1* et *OSC 2* à 3:00."
  - "*FILTER* en 4P LOW PASS, *CUTOFF* ≈ 12:30, petite *RESONANCE*, *EG AMOUNT* juste au-dessus de midi, *KB TRACKING* ON."
  - "*GLIDE* vers 1:00, puis *SETTINGS* → *CONFIG* (PGM 16) → page 1, PGM 3 → PGM 14 (exponentiel)."
  - "Vibrato : *LFO 2 DEST* sur PITCH, *LFO 2 RATE* ≈ 1:00, molette *MOD* à environ 20 %."
oreille:
  - "Glissés trop lents ou trop rapides : *GLIDE* par pas de ½ heure."
  - "Son trop « bouché » : *CUTOFF* vers 1:30 ; trop agressif : *WAVESHAPE* vers la scie (midi)."
  - "Vibrato : viser ≈ 5-6 Hz, à caler à l'oreille (calibration *LFO 2 RATE* à faire)."
jeu:
  - "Registre aigu : *KB OCTAVE* +1, jouer legato pour enchaîner les glissés."
  - Lâcher de longues notes tenues puis monter la molette pour le vibrato.
  - "Le *PITCH* wheel (±7 demi-tons par défaut) pour les inflexions."
analyse:
  - titre: "Les oscillateurs : deux carrés qui chantent"
    texte: >-
      Deux *carrés* en 8' légèrement désaccordés. Le carré (harmoniques impaires) a ce
      timbre creux proche d'une clarinette ; le désaccord crée un battement lent qui
      rend la note vivante. C'est la recette du lead « chantant » des Moog modulaires.
  - titre: "Le filtre : à moitié ouvert"
    texte: >-
      Filtre 4 pôles vers 12:30 : assez ouvert pour que le lead perce, assez fermé pour
      rester doux. *KB TRACKING* ON : le filtre suit le clavier, les notes aiguës ne
      deviennent pas étouffées. Petite *RESONANCE* : juste de la présence.
  - titre: "Les enveloppes : un son qui tient"
    texte: >-
      Ampli presque « orgue » avec une attaque très légèrement adoucie : la note démarre
      sans clic et tient tant qu'on garde la touche, comme une voix. L'enveloppe de
      filtre redescend doucement vers un sustain haut : un léger éclat à l'attaque, puis
      un timbre stable.
  - titre: "Le mouvement : glide et vibrato"
    texte: >-
      Ce lead est fait de mouvement : le *GLIDE* exponentiel fait glisser chaque note
      vers la suivante, comme un portamento de violon. Le vibrato à la molette
      (*LFO 2* sur PITCH) n'arrive que sur les notes tenues : c'est ce qui le rend
      expressif.
tracabilite:
  - "Documenté [1] [2] : solo improvisé sur le Moog modulaire de Keith Emerson, portamento très présent, carrés désaccordés (recette Syntorial)."
  - "Hypothèse [2] : portamento logarithmique, d'où le glide exponentiel. Affirmation d'un forum, non vérifiée."
  - "Reconstitué : positions du filtre, enveloppes, vitesse et profondeur du vibrato."
sources:
  - titre: "Lucky Man lead"
    site: Syntorial, preset recipe
    url: https://www.syntorial.com/preset-recipe/emerson-lake-and-palmer-lucky-man-lead/
    note: carrés désaccordés + glide
  - titre: "Help me please! Emerson Lake and Palmer"
    site: Moog Music, forum
    url: https://forum.moogmusic.com/t/help-me-please-emerson-lake-and-palmer/652
    note: modulaire, portamento logarithmique
