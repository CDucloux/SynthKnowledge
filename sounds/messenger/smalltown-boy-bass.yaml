synth: messenger
title: Smalltown Boy Bass
category: basse
tags: [hi-nrg, synthpop, "80s", octaves, arp]
confidence: 2
reference:
  artist: Bronski Beat
  song: Smalltown Boy
  year: 1984
  part: basse pulsée en octaves, tout le morceau
  original_synth: "Roland MC-202 (motif d'octaves séquencé) ; Pro-One, Memorymoog et DX7 crédités"
summary: >-
  Basse hi-NRG qui saute sans arrêt entre une note et son octave, comme un
  séquenceur : scie grave, sub carré, filtre assez fermé avec un petit coup
  d'enveloppe à chaque note. L'arpégiateur du Messenger fait les octaves tout seul.

params:
  osc:
    oct1: 16
    wave1: 12
    sub_wave: 10.75
  mixer:
    osc1: 17
    sub: 13
  filter:
    mode: lp4
    cutoff: 9.5
    eg_amount: 14
    resonance: 10
  fenv: {a: 7, d: 10, s: 8, r: 9}
  aenv: {a: 7, d: 12, s: 17, r: 8.5}

settings:
  - {name: "ARP PATTERN (SETTINGS 1)", value: "PGM 1 *Up*"}
  - {name: "ARP OCTAVE (SETTINGS 2)", value: "PGM 5 *2 Note* : chaque note puis son octave"}
  - {name: "GATE LENGTH (SETTINGS 3)", value: "PGM 8 (50 %)"}
  - {name: "CLOCK DIV (SETTINGS 9)", value: "PGM 7 (croches) ; PGM 4 si trop lent"}

steps:
  - Maintenir *PANEL* 1 s (init), puis *ARP* + *PANEL* pour initialiser l'arpégiateur.
  - "*OCTAVE 1* sur 16', *WAVESHAPE 1* à midi (scie). *SUB WAVE* ≈ 10:45 (carré)."
  - "*MIXER* : *OSC 1* à fond, *SUB* ≈ 1:00."
  - "*FILTER* : 4P LOW PASS, *CUTOFF* ≈ 9:30, *RESONANCE* ≈ 10:00, *EG AMOUNT* ≈ 2:00."
  - "Enveloppe filtre : *DECAY* ≈ 10:00, *SUSTAIN* presque nul. Ampli : orgue, *RELEASE* court."
  - "*SETTINGS* : régler l'arpégiateur comme dans le cadre ci-contre."
  - "*DIRECTION* sur PAT, *PLAY*, *HOLD* ; caler *TEMPO* sur le disque."
tweaks:
  - "Pas assez de « toc » sur chaque note : *EG AMOUNT* vers 2:30, *DECAY* filtre plus court."
  - "Trop sombre (le mix d'origine est très brillant) : *CUTOFF* vers 10:30."
  - "Grave qui bave : *SUB* vers 11:00, ou *GATE LENGTH* plus court (PGM 6)."
  - "Rythme deux fois trop lent ou rapide : changer *CLOCK DIV* (PGM 4 ou 7)."
playing:
  - "Tenir une seule note grave par accord : l'arpégiateur joue note, octave, note, octave."
  - "Changer de note pile sur le temps ; avec *HOLD* la note reste jusqu'à la suivante."
  - "Sans arpégiateur : jouer les octaves à la main, détaché, poignet souple."
analysis:
  - title: "Les oscillateurs : du grave plein"
    text: >-
      Une seule *scie* en 16' : c'est l'onde la plus riche, elle contient toutes les
      harmoniques, donc le filtre a de la matière à sculpter. Le *sub carré* joue une
      octave plus bas et n'apporte que des harmoniques impaires : il épaissit le
      fondamental sans brouiller le timbre. Pas de deuxième oscillateur ni de désaccord :
      une basse de séquenceur doit rester nette et parfaitement juste.
  - title: "Le filtre : sombre mais vivant"
    text: >-
      Le 4 pôles (24 dB/oct) coupe franchement : avec *CUTOFF* vers 9:30 il ne reste
      que le corps de la note. C'est l'*EG AMOUNT* qui fait le travail : à chaque note
      il ouvre le filtre puis le referme, d'où le petit « toc » qui donne la pulsation.
      Un peu de *RESONANCE* (10:00) creuse ce coup d'ouverture sans siffler.
  - title: "Les enveloppes : le toc et le corps"
    text: >-
      Enveloppe de filtre percussive : attaque nulle, *DECAY* court, *SUSTAIN* presque
      nul. Le timbre est brillant à l'attaque puis se ferme aussitôt : c'est l'ADN des
      basses de séquenceur (MC-202, TB-303). Le critique de [2] y entend un écho de « Tainted Love ». L'ampli, lui, reste « orgue » (sustain à
      fond) : le volume tient toute la note, c'est la longueur de gate de l'arpégiateur
      qui la coupe. *RELEASE* court pour que les notes ne se marchent pas dessus.
  - title: "Le mouvement : l'octave qui saute"
    text: >-
      Le cœur du son n'est pas le timbre mais le motif, né d'une séquence d'octaves sur MC-202 [1] : note grave, octave, note,
      octave, en continu. L'octave haute fait ressortir les harmoniques, la basse
      porte le grave : l'oreille entend une seule ligne qui rebondit. Gate à 50 % :
      chaque note est détachée, ce qui donne le côté mécanique et dansant du hi-NRG^[Hi-NRG : disco électronique rapide du début des années 80, le son des clubs gays de l'époque, auquel le morceau emprunte son tempo [1].].
traceability:
  - "Documenté [1] : le morceau est né d'un motif d'octaves séquencé sur Roland MC-202 ; synthés crédités : DX7, Memorymoog, Pro-One."
  - "Impression d'un critique [2] : basse proche de celle de « Tainted Love », mix très brillant (aigus des synthés poussés)."
  - "Non vérifié [3] : un amateur cite le preset DX7 « Bass1 » en renfort."
  - "Reconstitué : timbre, positions du filtre et des enveloppes, division rythmique de l'arpégiateur (croches)."
