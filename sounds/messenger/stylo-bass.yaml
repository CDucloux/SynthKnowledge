synthe: messenger
titre: Stylo Bass
categorie: basse
tags: [electro-funk, "2010s", synth-pop, legato]
confiance: 1
reference:
  artiste: Gorillaz
  morceau: Stylo
  annee: 2010
  passage: riff de basse synthé, tout le morceau
  synthe_origine: "non documenté (Albarn crédité aux claviers ; source « module ou VST » selon [2])"
resume: >-
  Basse électro-funk sombre et ronde : deux scies graves légèrement désaccordées
  et un sub carré, dans un passe-bas 4 pôles assez fermé que l'enveloppe ouvre à
  peine à chaque note. Riff syncopé de quatre notes, joué serré et legato.

params:
  osc:
    oct1: 16
    oct2: 16
    wave1: 12
    wave2: 12
    osc2_freq: 12.1
    sub_wave: 10.75
  mixer:
    osc1: 17
    osc2: 14
    sub: 13
  filter:
    mode: lp4
    cutoff: 9.5
    eg_amount: 13.5
    resonance: 9
    res_bass: true
  fenv: {a: 7, d: 11.5, s: 10, r: 9}
  aenv: {a: 7, d: 12, s: 17, r: 8.5}
  env:
    multi_trig: false
  perf:
    glide: 8

etapes:
  - Maintenir *PANEL* 1 s (init).
  - "*OCTAVE 1* et *2* sur 16', scies (*WAVESHAPE* à midi). *OSC 2 FREQ* à peine à droite de midi (≈ 12:05)."
  - "*SUB WAVE* ≈ 10:45 (carré). *MIXER* : *OSC 1* à fond, *OSC 2* ≈ 2:00, *SUB* ≈ 1:00."
  - "*FILTER* : 4P LOW PASS, *CUTOFF* ≈ 9:30, *RESONANCE* ≈ 9:00, *RES BASS* ON."
  - "*EG AMOUNT* ≈ 1:30 ; enveloppe filtre : *DECAY* ≈ 11:30, *SUSTAIN* ≈ 10:00."
  - "Enveloppe ampli : orgue, *RELEASE* très court ≈ 8:30. *MULTI-TRIG* OFF, *GLIDE* ≈ 8:00 (à peine)."
oreille:
  - "Trop clair, pas assez « nuit » : *CUTOFF* vers 9:00, *EG AMOUNT* vers 1:00."
  - "Les notes manquent d'attaque : *DECAY* filtre vers 12:00, *MULTI-TRIG* ON."
  - "Pas assez de poids dans le bas : *SUB* vers 2:00, *OSC 2* un peu moins fort."
  - "Trop statique : *OSC 2 FREQ* un peu plus loin de midi pour un léger battement."
jeu:
  - "Riff syncopé : notes courtes et précises, le groove vient des silences."
  - "Lier les notes du passage chromatique : elles glissent dans l'enveloppe sans repincer."
  - "Le Messenger n'a pas d'écho : ajouter un delay externe si on veut l'ambiance du disque."

analyse:
  - titre: "Les oscillateurs : deux scies et un sub"
    texte: >-
      Deux scies 16' donnent toutes les harmoniques, donc de la matière à
      filtrer ; *OSC 2* très légèrement désaccordé crée un battement lent qui
      épaissit la note sans la rendre floue. Le *SUB* carré, une octave sous
      *OSC 1*, assoit le fondamental : c'est lui qui pèse dans un mix chargé.
  - titre: "Le filtre : sombre mais vivant"
    texte: >-
      Le passe-bas 4 pôles (24 dB par octave) coupe net au-dessus du
      *CUTOFF* : à 9:30 il ne reste que le bas du spectre, d'où la couleur
      sourde et nocturne du morceau, que Wikipédia classe en électro-funk [1].
      Une résonance faible sans plus : on veut de la rondeur, pas un « wah ».
      *RES BASS* garde le grave intact.
  - titre: "Les enveloppes : un pincé discret"
    texte: >-
      L'enveloppe de filtre ouvre brièvement chaque note puis redescend vers un
      *SUSTAIN* bas : un petit « tok » d'attaque, puis une tenue ronde.
      L'ampli reste en orgue (*SUSTAIN* au max) avec un *RELEASE* très court :
      la note s'arrête dès qu'on lâche, ce qui rend la syncope lisible.
  - titre: "Le jeu : quatre notes et des silences"
    texte: >-
      Selon [2], le groove repose sur une figure syncopée de quatre notes qui
      rebondit trois mesures puis descend chromatiquement. Sur le Messenger,
      *MULTI-TRIG* OFF laisse les notes liées dans la même enveloppe : on
      pince les notes détachées, on lie la descente^[Un soupçon de *GLIDE*
      adoucit les liaisons sans faire glisser audiblement.].

tracabilite:
  - "Documenté [1] : morceau de 2009-2010, électro-funk, Damon Albarn aux claviers, produit par Gorillaz ; aucun synthé nommé."
  - "Documenté [2] : figure syncopée de quatre notes puis passage chromatique ; l'auteur ne sait pas si c'est un module ou un VST."
  - "Reconstitué : tout le patch (scies, sub, filtre, enveloppes) est une approximation à l'écoute ; le synthé d'origine reste inconnu."

sources:
  - titre: "Stylo (song)"
    site: Wikipedia
    url: https://en.wikipedia.org/wiki/Stylo_(song)
    note: genre, crédits (Albarn claviers, enregistré en 2009 au Studio 13 et Chung King)
  - titre: "Beat Breakdown: Gorillaz feat. Mos Def & Bobby Womack, Stylo"
    site: BeatTips (Amir Said)
    date: octobre 2019
    url: https://beattips.com/beat-breakdown-gorillaz-feat-mos-def-bobby-womack-stylo/
    note: structure du riff de synthé, source sonore incertaine
