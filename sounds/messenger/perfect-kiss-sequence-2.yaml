reference:
  artist: New Order
  song: The Perfect Kiss
  year: 1985
  part: basse séquencée en octaves (doubles croches), sous la séquence 1
  original_synth: "Prophet-5 et Polysequencer (séquences de Low-Life, selon Peter Hook)"
  original_synth_short: Prophet-5 (séquences)
summary: >-
  La deuxième séquence, dans le grave : des doubles croches qui sautent d'une
  octave à l'autre, deux notes en bas, deux en haut, sur Fa, Mi, Ré puis Sol.
  Un son de basse synthé rond et pincé qui sert de moteur sous la séquence
  métallique et la basse de Peter Hook.

