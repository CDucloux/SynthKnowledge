steps:
  - "Maintenir *PANEL* 1 s (init)."
  - "*OCTAVE 1* et *2* sur 16'. *WAVESHAPE 1* à midi (scie), *WAVESHAPE 2* ≈ 1:15 (carré)."
  - "*OSC 2 FREQ* à peine à droite de midi (léger battement). *MIXER* : *OSC 1* à fond, *OSC 2* ≈ 2:00."
  - "*FILTER* : 4P LOW PASS, *CUTOFF* ≈ 1:00, *RESONANCE* ≈ 10:00, *RES BASS* ON, *KB TRACKING* ON, *EG AMOUNT* 12:30 (+10 %)."
  - "Enveloppes sans sustain : filtre *DECAY* ≈ 10:00, ampli *DECAY* ≈ 10:45. *MULTI-TRIG* ON."
tweaks:
  - "Les octaves aiguës percent trop : *KB TRACKING* OFF ou *CUTOFF* vers 12:30."
  - "Pas assez de rebond : *DECAY* du filtre vers 9:30, *EG AMOUNT* vers 1:00 (+20 %)."
  - "Trop grave ou trop aigu : *OCTAVE 1* et *2* d'un cran."
playing:
  - "Saisie : *DIRECTION* sur SEQ, *RECORD*, les 64 pas, *RECORD*, *PLAY*. Ré3 et Mi3 sont sous le clavier : *KB OCTAVE* −1 pour les saisir."

analysis:
  - title: "Les oscillateurs : scie et carré pour une basse ronde"
    text: >-
      Les séquences de Low-Life sortaient du système Prophet-5 [1], un synthé à
      deux oscillateurs. Une *scie* et un *carré* à peine désaccordés donnent un
      grave plein et un peu épais ; la scie apporte les harmoniques que le filtre
      va découper à chaque note.
  - title: "Le filtre : fermé, il rebondit"
    text: >-
      *CUTOFF* modéré, *EG AMOUNT* franc et *DECAY* court : chaque double croche
      claque puis s'arrondit. Le *KB TRACKING* garde la même brillance entre la
      note basse et son octave, sinon la note du haut paraîtrait plus sourde.
  - title: "Les enveloppes : des impulsions"
    text: >-
      Ni attaque ni sustain : chaque pas est un coup bref. *MULTI-TRIG* relance
      les enveloppes même sur deux notes identiques, ce qui fait entendre les
      paires « bas, bas, haut, haut ».
  - title: "Le mouvement : le saut d'octave"
    text: >-
      Deux notes en bas, deux en haut, sur Fa, Mi, Ré, puis Sol joué deux octaves
      d'écart [2][3] : le saut d'octave donne l'élan disco du morceau, sans changer
      d'accord. Elle joue sous la séquence 1 et la basse de Peter Hook, qui chante
      dans l'aigu.

traceability:
  - "Documenté [1] : séquences de Low-Life sur le système Prophet-5 et Polysequencer (Peter Hook, 1985) ; patch de cette partie non documenté."
  - "Transcrit [2][3] : notes et rythme (130 BPM, Fa, Mi, Ré, Sol en octaves), identiques sur les deux relevés de contributeurs."
  - "Reconstitué : formes d'onde, filtre, enveloppes et positions Messenger à l'oreille ; notes saisies deux octaves plus haut que le relevé."

