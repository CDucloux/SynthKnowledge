synth: messenger
title: Thriller Bass
category: basse
tags: [funk, disco, "80s", pwm, arp-2600]
confidence: 2
reference:
  artist: Michael Jackson
  song: Thriller
  year: 1982
  part: ligne de basse de Rod Temperton, tout le morceau
  original_synth: "ARP 2600 « Tonus » (Anthony Marinelli) ; Minimoog ou Jupiter-8 selon d'autres récits"
  original_synth_short: ARP 2600
summary: >-
  La basse funk-disco la plus célèbre des années 80 : une scie et un carré en 16',
  légèrement désaccordés, sous un filtre 4 pôles assez fermé qui s'ouvre à chaque
  note. Un PWM lent fait bouger le carré : la basse vit sans changer de hauteur.

params:
  lfo1:
    rate: 9.5
    depth: 12.75
    wave: tri
    dest: osc1_wave
  osc:
    oct1: 16
    oct2: 16
    wave1: 13.5
    wave2: 12
    osc2_freq: 12.1
  mixer:
    osc1: 17
    osc2: 15
  filter:
    mode: lp4
    cutoff: 13.5
    eg_amount: 12.5
    resonance: 12
    res_bass: true
  fenv: {a: 7, d: 10, s: 9, r: 9}
  aenv: {a: 7, d: 12, s: 17, r: 8.5}
  env:
    f_vel: true

steps:
  - Maintenir *PANEL* 1 s (init).
  - "*OCTAVE 1* et *OCTAVE 2* sur 16'. *WAVESHAPE 1* ≈ 1:30 (carré), *WAVESHAPE 2* à midi (scie)."
  - "*OSC 2 FREQ* à peine à droite de midi (battement lent). *MIXER* : *OSC 1* à fond, *OSC 2* ≈ 3:00."
  - "*LFO 1* : TRI vers OSC 1 WAVE, *RATE* ≈ 9:30 (lent), *DEPTH* ≈ 12:45 (PWM léger)."
  - "*FILTER* : 4P LOW PASS, *CUTOFF* ≈ 1:30 (le corps), *RESONANCE* à midi, *RES BASS* ON."
  - "*EG AMOUNT* ≈ 12:30 (+10 %) ; enveloppe filtre : *DECAY* ≈ 10:00 (court), *SUSTAIN* ≈ 9:00. *F ENV VEL* ON."
  - "Enveloppe ampli : orgue (*SUSTAIN* à fond), *RELEASE* court ≈ 8:30."
tweaks:
  - "Pas assez de « pop » sur les notes : *EG AMOUNT* vers 1:00 (+20 %), *DECAY* filtre plus court."
  - "Trop sourd : *CUTOFF* vers 2:00 ; trop brillant, ça ne sonne plus « ronde » : vers 1:00."
  - "Ça siffle, trop « acid » : *RESONANCE* vers 11:00."
  - "Le carré bouge trop, effet « chorus » gênant : *DEPTH* du *LFO 1* vers 12:20."
playing:
  - "Tempo 118 BPM : notes courtes et détachées, le groove est dans les silences."
  - "Frapper un peu plus fort les notes d'appui : *F ENV VEL* les ouvre davantage."
  - "Pas de glide : chaque note attaque franchement, comme une basse au doigt."

analysis:
  - title: "Les oscillateurs : scie + carré, le duo funk"
    text: >-
      La *scie* apporte toutes les harmoniques (le mordant), le *carré* seulement les
      impaires (le creux, le rond). Ensemble en 16', légèrement désaccordés, ils
      donnent une note épaisse qui bat doucement [4]. Le *LFO 1* lent sur la forme du
      carré fait un PWM discret (la largeur du carré varie, son timbre aussi) : « de l'expression et du mouvement », selon [3].
  - title: "Le filtre : un ladder bien fermé qui mord"
    text: >-
      Le Tonus de Marinelli [2] a un filtre de type Moog [3], comme le 4 pôles du
      Messenger. *CUTOFF* bas (150 Hz selon [4]) ; sur le Messenger, 1:30 garde le corps de la note.
      La *RESONANCE* à mi-course donne le mordant [4], *RES BASS* garde le bas.
  - title: "Les enveloppes : ouvrir puis refermer"
    text: >-
      Tout le caractère vient de l'enveloppe de filtre [4] : à chaque note elle ouvre
      grand puis redescend en 100 ms environ vers un sustain bas. On entend un « pop » brillant
      puis une queue ronde. L'ampli reste plein (orgue) : ce sont la longueur des
      notes jouées et le *RELEASE* court qui découpent le groove.
  - title: "Le jeu : la précision avant tout"
    text: >-
      Ligne de Rod Temperton jouée à la main par Greg Phillinganes [2], 118 BPM, do
      dièse dorien [1]. Marinelli rejoue aussi la partie au Minimoog pour comparer
      [2]. La vélocité sur le filtre rend les nuances d'attaque.

traceability:
  - "Documenté [2] : Marinelli lui-même, ARP 2600 « Tonus », ligne de Temperton jouée par Phillinganes."
  - "Documenté [3][4] : filtre ladder, PWM ; scie et carré, 150 Hz, résonance à mi-course, decay 100 ms."
  - "Divergent : Minimoog, croyance répandue [4] ; Jupiter-8 [5] (fil non lu). Patch PDF de Marinelli non consulté."
  - "Reconstitué : toutes les positions Messenger."

