synth: messenger
title: I Feel Love Bass
category: basse
tags: [disco, "70s", sequence, moog-modulaire]
confidence: 2
reference:
  artist: Donna Summer
  song: I Feel Love
  year: 1977
  part: ostinato de basse séquencé, tout le morceau
  original_synth: "Moog modulaire d'Eberhard Schoener : ligne de Giorgio Moroder, Moog installé et synchronisé par Robby Wedel"
  original_synth_short: Moog modulaire
summary: >-
  La basse qui a inventé la dance électronique : un motif Do, Do, Sol, Si bémol
  en croches qui monte sur Mi bémol, Fa et Sol, doublé par un écho à la double croche qui donne le célèbre
  « ta-ta-ta-ta ». Deux scies de Moog modulaire, filtre fermé qui claque à chaque
  note, aucun sustain : un marteau mécanique.

