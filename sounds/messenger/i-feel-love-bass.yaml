steps:
  - "Maintenir *PANEL* 1 s (init)."
  - "*OCTAVE 1* sur 16', *OCTAVE 2* sur 32', *WAVESHAPE 1* et *2* à midi (deux scies)."
  - "*OSC 2 FREQ* à peine à droite de midi (léger battement). *MIXER* : *OSC 1* à fond, *OSC 2* ≈ 2:00."
  - "*FILTER* : 4P LOW PASS, *CUTOFF* ≈ 12:30, *RESONANCE* ≈ 11:00, *RES BASS* ON, *KB TRACKING* ON."
  - "*EG AMOUNT* ≈ 1:00 (+20 %). Enveloppe filtre : *DECAY* ≈ 10:15, *SUSTAIN* à 0. Enveloppe ampli : *DECAY* ≈ 11:30, *SUSTAIN* à 0."
  - "*MULTI-TRIG* ON. *LFO 1* : TRI vers CUTOFF, *RATE* ≈ 8:00, *DEPTH* ≈ 12:30 (le filtre respire)."
tweaks:
  - "Pas assez de « marteau » : *DECAY* du filtre vers 10:00, *EG AMOUNT* vers 1:30 (+30 %)."
  - "Trop brillant, ça sonne acid : *CUTOFF* vers midi, *RESONANCE* vers 10:00."
  - "Les doubles croches se collent : *GATE* plus court (*SETTINGS* 3, PGM 6)."
playing:
  - "Saisie : *DIRECTION* sur SEQ, *RECORD*, les 64 notes, *RECORD*, *PLAY*. Pour l'intro (Do seul), une séquence des 16 premiers pas."

analysis:
  - title: "Les oscillateurs : deux scies qui battent"
    text: >-
      Le Moog modulaire de Schoener était directement branché dans la console [1].
      Deux *scies*, l'une une octave plus bas, à peine désaccordées l'une de
      l'autre^[Un léger écart d'accord fait « battre » les deux ondes : le
      son épaissit et bouge sans changer de note.], comme dans la recette de
      MusicRadar [4] : toutes les harmoniques pour nourrir le filtre, et un grave
      plein.
  - title: "Le filtre : fermé, frappé à chaque note"
    text: >-
      *CUTOFF* modéré et *EG AMOUNT* franc : chaque note ouvre le filtre d'un coup,
      puis il se referme en 200 ms environ [4][5]. C'est le « marteau de géant sur
      un mur » décrit par Pete Bellotte [1]. *RESONANCE* modérée pour une
      pointe de voyelle, sans siffler ; *KB TRACKING* garde la même couleur quand
      la séquence monte en Fa ou en Sol.
  - title: "Les enveloppes : rien que du decay"
    text: >-
      Ni attaque ni sustain : les deux courbes tombent tout de suite, le filtre
      plus vite que le volume [5]. La note commence brillante et finit sourde,
      avant la suivante. *MULTI-TRIG* relance les enveloppes à chaque pas, même
      sur deux notes identiques.
  - title: "Le mouvement : l'écho devenu motif"
    text: >-
      Le motif joué est en croches (Do, Do, Sol, Si bémol) [3] ; un écho à la double
      croche, à droite, double chaque note [2], ce qui donne quatre Do, deux Sol,
      deux Si bémol [6]. Le motif monte ensuite sur Mi bémol, Fa et Sol, une
      mesure chacun : les 64 pas du séquenceur tiennent la boucle entière. Le Messenger n'a pas de delay : la grille écrit l'écho
      comme des notes. Avec une pédale de delay, saisir C5 . C5 . G5 . Bb5 . et
      régler l'écho à une double croche (≈ 117 ms à 128 BPM).

traceability:
  - "Documenté [1][2] : basse imaginée et enregistrée par Moroder sur le Moog de Schoener, que Wedel installe et synchronise sur la bande, branché en direct ; chaque note doublée par un écho, direct à gauche, écho à droite."
  - "Transcrit [3][6] : Do, Do, Sol, Si bémol en croches (130 BPM), en doubles croches avec l'écho (128 BPM) ; boucle Do, Mi bémol, Fa, Sol, une mesure chacun (mesures 41 à 44) ; l'intro reste sur Do."
  - "Recette [4][5] : deux scies dont une en 32', passe-bas, enveloppes sans sustain. Reconstitué : positions Messenger, écho écrit en notes."

